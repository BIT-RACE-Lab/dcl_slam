dcl_slam: {
  # Frames
  world_frame: "world",                   # global frame
  odom_frame: "camera_init",               # local frame

  # lidar configuration
  sensor: livox,                          # Mid-360 走 Livox 非重复扫描处理分支
  n_scan: 4,                              # MID-360 专用 Iris 投影（垂直视场 -7~52 度）

  # CPU params
  onboard_cpu_cores_num: 4,               # cores number of onboard unit
  loop_closure_process_interval: 0.01,    # interval of detecting loop (in second)
  map_publish_interval: 10.0,             # interval of publish global maps (in second)
  mapping_process_interval: 0.02,         # interval of optmization (in second)

  # keyframe params
  keyframe_distance_threshold: 1.0,       # keyframe distance threshold (in meter)
  keyframe_angle_threshold: 0.2,          # keyframe angle threshold (in rad)
  startup_multi_frame_enable: true,       # 静止启动时按时间强制采集多帧
  startup_keyframe_count: 60,             # 3 个互不重叠的 20 帧子图，约 6 秒完成
  startup_accumulation_frames: 20,        # MID-360 每个子图连续累计约 2 秒扫描
  startup_keyframe_interval: 0.08,        # 略低于 10Hz 周期，避免因时间抖动漏掉隔帧

  # mapping
  global_optmization_enable: true,        # enable distributed DGS
  use_between_noise: true,                # use between noise flag
  optmization_maximum_iteration: 30,      # maximum iterations time of optimization
  use_pcm: true,                          # enable pairwise consistency maximization (with descriptor_distance_threshold=0.5)
  pcm_threshold: 0.5,                     # confidence probability for PCM (i.e., 0.01, 0.05, 0.1, 0.25, 0.5, 0.75)

  # downsample
  descript_leaf_size: 0.1,                # descriptor downsample rate (default 0.1)
  map_leaf_size: 0.2,                     # 启动子图配准保留更多 MID-360 几何细节

  # loop closure
  intra_robot_loop_closure_enable: false, # enable to search intra-robot loop closre with global descriptor
  inter_robot_loop_closure_enable: true,  # enable to search intra-robot loop closre with global descriptor
  descriptor_type: "LidarIris",           # descriptor type: ScanContext, LidarIris, M2DP
  iris_min_valid_column_bins: 2,          # 方位列至少命中两个距离栅格才参与 yaw 匹配
  iris_min_valid_overlap_ratio: 0.25,     # 双方有效方位区域至少重合 25%
  knn_candidates: 6,                      # k nearest neighbor search of row key
  match_mode: 2,                          # iris-feature matching mode, (i.e., 0, 1, 2; default 2) 
  descriptor_distance_threshold: 0.4,     # iris-feature matching threshold
  exclude_recent_frame_num: 50,           # exclude recent keyframe in intra-robot loop closure
  search_radius: 40.0,                    # radius of radius search based intra-robot loop closure
  history_keyframe_search_num: 16,        # number of history frames in submap for scan-to-map matching
  fitness_score_threshold: 0.04,          # PCL 返回均方距离；0.04 对应约 0.20m RMSE
  inter_robot_max_correspondence_distance: 1.5, # 粗 ICP；适合近距离摆放的两车
  inter_robot_fine_correspondence_distance: 0.35, # 精 GICP，排除远处平行墙面
  inter_robot_yaw_search_range_deg: 10.0, # 在 Iris 航向结果两侧各搜索 10 度
  inter_robot_yaw_search_step_deg: 5.0,   # 0、±5、±10 度五个粗配准初值
  inter_robot_overlap_distance: 0.5,      # 计算双向重叠率的最近邻距离
  inter_robot_min_overlap_ratio: 0.35,    # 两个方向都至少 35% 点有近邻
  inter_robot_consistency_count: 3,       # 至少三次独立估计一致才提交跨车约束
  inter_robot_consistency_translation_threshold: 0.15, # 三个独立子图的平移一致性
  inter_robot_consistency_rotation_threshold: 0.08,    # 约 4.6 度
  inter_robot_translation_variance: 0.0025, # 已确认启动约束平移标准差 5cm
  inter_robot_rotation_variance: 0.0001,    # 已确认启动约束旋转标准差约 0.57 度
  world_to_odom_max_translation_jump: 0.30, # 锁存后拒绝超过 30cm 的全局坐标突变
  world_to_odom_max_rotation_jump: 0.10,    # 锁存后拒绝超过约 5.7 度的姿态突变
  ransac_maximum_iteration: 2000,         # RANSAC maximum iteration time
  ransac_threshold: 0.5,                  # 有限距离对应中至少一半为 RANSAC 内点
  ransac_outlier_reject_threshold: 0.2,   # RANSAC 内点距离（米）
}

common:
    # 使用 livox_ros_driver2 的 msg_MID360.launch（xfer_format:=1）输出。
    # 相对话题会自动落在 robotPrefix 命名空间，例如 /a/livox/lidar。
    lid_topic:  "livox/lidar"
    imu_topic:  "livox/imu"
    time_sync_en: false        # 已具备硬件时间同步时保持 false；不要无条件启用软件同步。
    
preprocess:
    lidar_type: 1                # 1: Livox CustomMsg；Mid-360 不应使用 Velodyne PointCloud2 分支。
    scan_line: 4                 # Mid-360 的 Fast-LIO 原版预处理参数
    scan_rate: 10                # 仅 Velodyne 分支使用；为兼容配置保留。
    timestamp_unit: 2            # the unit of time/t field in the PointCloud2 rostopic: 0-second, 1-milisecond, 2-microsecond, 3-nanosecond.
    blind: 0.5                   # Mid-360 的近距盲区（米）

mapping:
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree:    360
    det_range:     100.0
    extrinsic_est_en:  false      # true: enable the online estimation of IMU-LiDAR extrinsic
    extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
    extrinsic_R: [ 1, 0, 0,
                   0, 1, 0,
                   0, 0, 1]

publish:
    path_en:  false
    scan_publish_en:  true       # false: close all the point cloud output
    dense_publish_en: true       # false: low down the points number in a global-frame point clouds scan.
    scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame

pcd_save:
    pcd_save_en: false
    interval: -1                 # how many LiDAR frames saved in each pcd file; 
                                 # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.
